<div class="page">
  <div class="content">
    <div class="page-header">
      <h1 class="title">Пользователи</h1>

      <button
        mat-stroked-button
        color="primary"
        class="add"
        type="button"
        (click)="openCreateUserDialog()"
      >
        <mat-icon class="i">person_add</mat-icon>
        Добавить пользователя
      </button>
    </div>

    <app-async-state
      [loading]="loading()"
      [error]="error()"
      [empty]="!loading() && items().length === 0"
      loadingText="Загрузка пользователей…"
      emptyText="Пользователи пока не найдены."
    >
      <div class="list">
        <app-user-card
          *ngFor="let u of items()"
          [user]="u"
          (open)="onOpenUser($event)"
          (toggleBlock)="onToggleBlock($event)"
        ></app-user-card>
      </div>
    </app-async-state>

    <app-pagination
      [page]="page()"
      [pageSize]="pageSize()"
      [totalCount]="totalCount()"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
